<!DOCTYPE html>
<html lang="en">

<head>

   <!-- Required meta tags -->
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

   <!-- Bootstrap CSS -->
   <link rel="stylesheet"
      href="/shared/HTML-Template-Library/HTML-Templates-V3-western/pages/../_assets/thirdpartylib/bootstrap-4.3.1/css/bootstrap.min.css">

   <!-- Font Awesome CSS -->
   <link rel="stylesheet"
      href="/shared/HTML-Template-Library/HTML-Templates-V3-western/pages/../_assets/thirdpartylib/fontawesome-free-5.9.0-web/css/all.min.css">

   <!-- Template CSS -->
   <link rel="stylesheet"
      href="/shared/HTML-Template-Library/HTML-Templates-V3-western/pages/../_assets/css/styles.min.css">

   <link rel="stylesheet"
      href="/shared/HTML-Template-Library/HTML-Templates-V3-western/pages/../_assets/css/custom.css">

   <title>Flip Card Builder</title>

   <style>

      body {
         background: #f7f7f7;
      }

      .main-wrapper {
         padding: 40px 0;
      }

      .builder-box {
         background: white;
         border-radius: 12px;
         padding: 35px;
         box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      }

      .card-builder {
         border: 1px solid #d9d9d9;
         border-radius: 10px;
         padding: 25px;
         margin-bottom: 30px;
         background: white;
      }

      .tabs {
         display: flex;
         border-bottom: 2px solid #eee;
         margin-bottom: 25px;
      }

      .tab-btn {
         border: none;
         background: none;
         padding: 12px 24px;
         font-weight: 600;
         cursor: pointer;
         border-bottom: 3px solid transparent;
      }

      .tab-btn.active {
         color: #007bff;
         border-color: #007bff;
      }

      .tab-content {
         display: none;
      }

      .tab-content.active {
         display: block;
      }

      .preview-section,
      .final-section {
         display: none;
         min-height: 100vh;
         margin-top: 40px;
         padding: 30px;
         background: white;
         border-radius: 12px;
      }

      .preview-grid {
         display: grid;
         grid-template-columns: repeat(2, 1fr);
         gap: 30px;
      }

      @media(max-width: 768px) {

         .preview-grid {
            grid-template-columns: 1fr;
         }

      }

      /* FLIP CARD */

      .flip-card {
         perspective: 1200px;
         height: 500px;
      }

      .flip-inner {
         position: relative;
         width: 100%;
         height: 100%;
         transition: transform 0.8s;
         transform-style: preserve-3d;
      }

      .flip-card.flipped .flip-inner {
         transform: rotateY(180deg);
      }

      .flip-front,
      .flip-back {
         position: absolute;
         width: 100%;
         height: 100%;
         backface-visibility: hidden;
         border-radius: 12px;
         overflow: hidden;
         background: white;
         border: 2px solid #d9d9d9;
         box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      }

      .flip-back {
         transform: rotateY(180deg);
      }

      .flip-media {
         width: 100%;
         height: 220px;
         object-fit: cover;
         background: #eee;
      }

      .flip-body {
         padding: 24px;
      }

      .flip-title {
         font-size: 1.4rem;
         font-weight: 700;
         margin-bottom: 15px;
      }

      .flip-text {
         color: #555;
         line-height: 1.7;
      }

      .flip-toggle {
         position: absolute;
         bottom: 18px;
         right: 18px;
         width: 50px;
         height: 50px;
         border-radius: 50%;
         border: none;
         background: #007bff;
         color: white;
         cursor: pointer;
      }

      .media-preview img,
      .media-preview video {
         width: 120px;
         border-radius: 8px;
         margin-top: 10px;
      }

      textarea {
         resize: vertical;
      }

      .action-buttons,
      .preview-buttons {
         margin-top: 30px;
         display: flex;
         gap: 15px;
         flex-wrap: wrap;
      }

   </style>

</head>

<body>

<div class="container-fluid main-wrapper">

<div class="row">

<div class="col-lg-10 offset-lg-1">

<div class="builder-box">

   <!-- MAIN TITLE -->

   <div class="form-group mb-5">

      <label>
         <strong>Main Flip Card Title</strong>
      </label>

      <input
         type="text"
         class="form-control"
         id="mainFlipTitle"
         placeholder="Enter main flip card title"
      >

   </div>

   <!-- CARD CONTAINER -->

   <div id="cardContainer"></div>

   <!-- ADD ROW -->

   <button class="btn btn-outline-primary mb-4" id="addRowBtn">

      <i class="fas fa-plus"></i> Add Row

   </button>

   <!-- ACTIONS -->

   <div class="action-buttons">

      <button class="btn btn-primary" id="previewBtn">
         Preview
      </button>

   </div>

   <!-- PREVIEW -->

   <div class="preview-section" id="previewSection">

      <h2 class="mb-4">Preview</h2>

      <div class="preview-grid" id="previewGrid"></div>

      <div class="preview-buttons">

         <button class="btn btn-secondary" id="backBtn">
            Back
         </button>

         <button class="btn btn-success" id="submitBtn">
            Submit
         </button>

      </div>

   </div>

   <!-- FINAL -->

   <div class="final-section" id="finalSection">

      <h2 class="mb-5 text-center" id="finalTitle"></h2>

      <div class="preview-grid" id="finalGrid"></div>

   </div>

</div>

</div>

</div>

</div>

<script>

let cardCount = 0;

const cardContainer = document.getElementById("cardContainer");

function createCardBuilder(data = {}) {

   cardCount++;

   const wrapper = document.createElement("div");

   wrapper.className = "card-builder";

   wrapper.innerHTML = `

      <div class="d-flex justify-content-between align-items-center mb-4">

         <h4 class="mb-0">
            Row ${cardCount} Flip Card
         </h4>

         <button class="btn btn-outline-danger delete-row-btn">

            <i class="fas fa-trash"></i>

         </button>

      </div>

      <!-- TABS -->

      <div class="tabs">

         <button class="tab-btn active"
            data-tab="front-${cardCount}">

            Front

         </button>

         <button class="tab-btn"
            data-tab="back-${cardCount}">

            Back

         </button>

      </div>

      <!-- FRONT -->

      <div class="tab-content active"
         id="front-${cardCount}">

         <div class="form-group">

            <label>
               <strong>Title</strong>
            </label>

            <input
               type="text"
               class="form-control front-title"
               value="${data.frontTitle || ""}"
            >

         </div>

         <div class="form-group">

            <label>
               <strong>Content</strong>
            </label>

            <textarea
               class="form-control front-content"
               rows="4"
            >${data.frontContent || ""}</textarea>

         </div>

         <div class="form-group">

            <label>
               <strong>Upload File</strong>
            </label>

            <input
               type="file"
               class="form-control-file front-file"
               accept="image/*,video/*,.gif"
            >

            <div class="media-preview"></div>

         </div>

      </div>

      <!-- BACK -->

      <div class="tab-content"
         id="back-${cardCount}">

         <div class="form-group">

            <label>
               <strong>Title</strong>
            </label>

            <input
               type="text"
               class="form-control back-title"
               value="${data.backTitle || ""}"
            >

         </div>

         <div class="form-group">

            <label>
               <strong>Content</strong>
            </label>

            <textarea
               class="form-control back-content"
               rows="4"
            >${data.backContent || ""}</textarea>

         </div>

         <div class="form-group">

            <label>
               <strong>Upload File</strong>
            </label>

            <input
               type="file"
               class="form-control-file back-file"
               accept="image/*,video/*,.gif"
            >

            <div class="media-preview"></div>

         </div>

      </div>

   `;

   cardContainer.appendChild(wrapper);

   setupTabs(wrapper);
   setupDelete(wrapper);
   setupAutosave(wrapper);
   setupFilePreview(wrapper);

}

function setupTabs(wrapper) {

   const buttons = wrapper.querySelectorAll(".tab-btn");

   buttons.forEach(btn => {

      btn.addEventListener("click", function() {

         wrapper.querySelectorAll(".tab-btn")
            .forEach(b => b.classList.remove("active"));

         wrapper.querySelectorAll(".tab-content")
            .forEach(c => c.classList.remove("active"));

         this.classList.add("active");

         document
            .getElementById(this.dataset.tab)
            .classList.add("active");

      });

   });

}

function setupDelete(wrapper) {

   wrapper
      .querySelector(".delete-row-btn")
      .addEventListener("click", function() {

      if(confirm("Delete this flip card?")) {

         wrapper.remove();

         saveState();

      }

   });

}

function setupAutosave(wrapper) {

   wrapper
      .querySelectorAll("input, textarea")
      .forEach(input => {

      input.addEventListener("input", saveState);

   });

}

function setupFilePreview(wrapper) {

   const fileInputs =
      wrapper.querySelectorAll("input[type='file']");

   fileInputs.forEach(input => {

      input.addEventListener("change", function() {

         const preview =
            this.parentElement.querySelector(".media-preview");

         preview.innerHTML = "";

         const file = this.files[0];

         if(!file) return;

         const url = URL.createObjectURL(file);

         if(file.type.startsWith("image")) {

            preview.innerHTML =
               `<img src="${url}">`;

         }

         else if(file.type.startsWith("video")) {

            preview.innerHTML =
               `<video src="${url}" controls></video>`;

         }

      });

   });

}

function getMediaHTML(fileInput) {

   const file = fileInput.files[0];

   if(!file) return "";

   const url = URL.createObjectURL(file);

   if(file.type.startsWith("image")) {

      return `
         <img src="${url}" class="flip-media">
      `;

   }

   if(file.type.startsWith("video")) {

      return `
         <video class="flip-media" controls>
            <source src="${url}" type="${file.type}">
         </video>
      `;

   }

   return "";

}

function generateCards(targetGridId) {

   const targetGrid =
      document.getElementById(targetGridId);

   targetGrid.innerHTML = "";

   document
      .querySelectorAll(".card-builder")
      .forEach(builder => {

      const frontTitle =
         builder.querySelector(".front-title").value;

      const frontContent =
         builder.querySelector(".front-content").value;

      const frontFile =
         builder.querySelector(".front-file");

      const backTitle =
         builder.querySelector(".back-title").value;

      const backContent =
         builder.querySelector(".back-content").value;

      const backFile =
         builder.querySelector(".back-file");

      const frontMedia =
         getMediaHTML(frontFile);

      const backMedia =
         getMediaHTML(backFile);

      const card =
         document.createElement("div");

      card.className = "flip-card";

      card.innerHTML = `

         <div class="flip-inner">

            <!-- FRONT -->

            <div class="flip-front">

               ${frontMedia}

               <div class="flip-body">

                  <div class="flip-title">
                     ${frontTitle}
                  </div>

                  <div class="flip-text">
                     ${frontContent}
                  </div>

               </div>

               <button class="flip-toggle">

                  <i class="fas fa-sync-alt"></i>

               </button>

            </div>

            <!-- BACK -->

            <div class="flip-back">

               ${backMedia}

               <div class="flip-body">

                  <div class="flip-title">
                     ${backTitle}
                  </div>

                  <div class="flip-text">
                     ${backContent}
                  </div>

               </div>

               <button class="flip-toggle">

                  <i class="fas fa-sync-alt"></i>

               </button>

            </div>

         </div>

      `;

      targetGrid.appendChild(card);

   });

   setupFlipCards();

}

function setupFlipCards() {

   document
      .querySelectorAll(".flip-card")
      .forEach(card => {

      card.addEventListener("click", function(e) {

         if(
            e.target.closest(".flip-toggle") ||
            !e.target.closest("video")
         ) {

            this.classList.toggle("flipped");

         }

      });

   });

}

function saveState() {

   const data = {

      mainTitle:
         document.getElementById("mainFlipTitle").value,

      cards: []

   };

   document
      .querySelectorAll(".card-builder")
      .forEach(builder => {

      data.cards.push({

         frontTitle:
            builder.querySelector(".front-title").value,

         frontContent:
            builder.querySelector(".front-content").value,

         backTitle:
            builder.querySelector(".back-title").value,

         backContent:
            builder.querySelector(".back-content").value

      });

   });

   localStorage.setItem(
      "flipCardBuilderData",
      JSON.stringify(data)
   );

}

function loadState() {

   const saved =
      localStorage.getItem("flipCardBuilderData");

   if(!saved) {

      createCardBuilder();

      return;

   }

   const parsed = JSON.parse(saved);

   document.getElementById("mainFlipTitle").value =
      parsed.mainTitle || "";

   parsed.cards.forEach(card => {

      createCardBuilder(card);

   });

}

/* BUTTONS */

document
   .getElementById("mainFlipTitle")
   .addEventListener("input", saveState);

document
   .getElementById("addRowBtn")
   .addEventListener("click", function() {

   createCardBuilder();

   saveState();

});

document
   .getElementById("previewBtn")
   .addEventListener("click", function() {

   generateCards("previewGrid");

   document
      .getElementById("previewSection")
      .style.display = "block";

   window.scrollTo({

      top:
      document.getElementById("previewSection").offsetTop,

      behavior: "smooth"

   });

});

document
   .getElementById("backBtn")
   .addEventListener("click", function() {

   document
      .getElementById("previewSection")
      .style.display = "none";

   window.scrollTo({

      top: 0,
      behavior: "smooth"

   });

});

document
   .getElementById("submitBtn")
   .addEventListener("click", function() {

   document
      .getElementById("previewSection")
      .style.display = "none";

   document
      .getElementById("cardContainer")
      .style.display = "none";

   document
      .getElementById("addRowBtn")
      .style.display = "none";

   document
      .querySelector(".action-buttons")
      .style.display = "none";

   document
      .getElementById("mainFlipTitle")
      .style.display = "none";

   document
      .querySelector("label")
      .style.display = "none";

   generateCards("finalGrid");

   document
      .getElementById("finalTitle")
      .innerText =
      document.getElementById("mainFlipTitle").value;

   document
      .getElementById("finalSection")
      .style.display = "block";

   localStorage.removeItem("flipCardBuilderData");

   window.scrollTo({

      top: 0,
      behavior: "smooth"

   });

});

/* INIT */

loadState();

</script>

</body>

</html>
