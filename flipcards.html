<!DOCTYPE html>
<html lang="en"><head>

   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

   <!-- Bootstrap CSS -->
   <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

   <!-- Font Awesome -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

   <title>Flip Card Builder</title>

   <style>

      body {
         background: #f7f7f7;
         padding: 40px 0;
      }

      .builder-box {
         background: white;
         border-radius: 12px;
         padding: 35px;
         box-shadow: 0 5px 18px rgba(0,0,0,.08);
      }

      .card-builder {
         border: 1px solid #ddd;
         border-radius: 12px;
         padding: 25px;
         margin-bottom: 30px;
         background: white;
      }

      .tabs {
         display: flex;
         border-bottom: 2px solid #eee;
         margin-bottom: 25px;
      }

      .tab-btn {
         border: none;
         background: none;
         padding: 12px 24px;
         cursor: pointer;
         font-weight: 600;
         border-bottom: 3px solid transparent;
      }

      .tab-btn.active {
         color: #007bff;
         border-color: #007bff;
      }

      .tab-content {
         display: none;
      }

      .tab-content.active {
         display: block;
      }

      .preview-section,
      .generated-section {
         display: none;
         margin-top: 50px;
         background: white;
         padding: 30px;
         border-radius: 12px;
      }

      .preview-grid {
         display: grid;
         grid-template-columns: repeat(2,1fr);
         gap: 30px;
      }

      @media(max-width:768px) {

         .preview-grid {
            grid-template-columns: 1fr;
         }

      }

      /* FLIP CARD */

      .flip-card {
         perspective: 1200px;
         height: 500px;
         cursor: pointer;
      }

      .flip-inner {
         position: relative;
         width: 100%;
         height: 100%;
         transition: transform .8s;
         transform-style: preserve-3d;
      }

      .flip-card.flipped .flip-inner {
         transform: rotateY(180deg);
      }

      .flip-front,
      .flip-back {
         position: absolute;
         width: 100%;
         height: 100%;
         backface-visibility: hidden;
         border-radius: 12px;
         overflow: hidden;
         background: white;
         border: 2px solid #ddd;
         box-shadow: 0 5px 20px rgba(0,0,0,.08);
      }

      .flip-back {
         transform: rotateY(180deg);
      }

      .flip-media {
         width: 100%;
         height: 220px;
         object-fit: cover;
      }

      .flip-body {
         padding: 24px;
      }

      .flip-title {
         font-size: 1.4rem;
         font-weight: 700;
         margin-bottom: 15px;
      }

      .flip-text {
         line-height: 1.7;
         color: #555;
      }

      .media-preview img {
         width: 120px;
         border-radius: 8px;
         margin-top: 10px;
      }

      textarea {
         resize: vertical;
      }

      .action-buttons {
         margin-top: 30px;
         display: flex;
         gap: 15px;
         flex-wrap: wrap;
      }

      #generatedCode {
         font-family: monospace;
      }

   </style>

</head><body><div class="container">
<div class="builder-box"><!-- MAIN TITLE -->
<div class="form-group mb-5"><label>&nbsp;<strong>Main Flip Card Title</strong> </label> <input type="text" class="form-control" id="mainFlipTitle" placeholder="Enter title"></div>
<!-- CARD CONTAINER -->
<div id="cardContainer"></div>
<!-- ADD ROW --> <button class="btn btn-outline-primary mb-4" id="addRowBtn"> <i class="fas fa-plus"></i> Add Row </button> <!-- ACTIONS -->
<div class="action-buttons"><button class="btn btn-primary" id="previewBtn"> Preview </button></div>
<!-- PREVIEW -->
<div class="preview-section" id="previewSection">
<h2 class="mb-4">Preview</h2>
<div class="preview-grid" id="previewGrid"></div>
<div class="action-buttons"><button class="btn btn-secondary" id="backBtn"> Back </button> <button class="btn btn-success" id="submitBtn"> Generate Final HTML </button></div>
</div>
<!-- GENERATED HTML -->
<div class="generated-section" id="generatedSection">
<h2 class="mb-4">Copy Final HTML</h2>
<textarea id="generatedCode" class="form-control" rows="22"></textarea> <button class="btn btn-primary mt-3" id="copyCodeBtn"> <i class="fas fa-copy"></i> Copy Final HTML </button></div>
</div>
</div>
<p><script>

let cardCount = 0;

/* CREATE CARD BUILDER */

function createCardBuilder() {

   cardCount++;

   const wrapper = document.createElement("div");

   wrapper.className = "card-builder";

   wrapper.innerHTML = `

      <div class="d-flex justify-content-between align-items-center mb-4">

         <h4>
            Row ${cardCount}
         </h4>

         <button
            class="btn btn-outline-danger delete-btn"
         >

            <i class="fas fa-trash"></i>

         </button>

      </div>

      <!-- TABS -->

      <div class="tabs">

         <button
            class="tab-btn active"
            data-tab="front-${cardCount}"
         >

            Front

         </button>

         <button
            class="tab-btn"
            data-tab="back-${cardCount}"
         >

            Back

         </button>

      </div>

      <!-- FRONT -->

      <div
         class="tab-content active"
         id="front-${cardCount}"
      >

         <div class="form-group">

            <label>
               <strong>Title</strong>
            </label>

            <input
               type="text"
               class="form-control front-title"
            >

         </div>

         <div class="form-group">

            <label>
               <strong>Content</strong>
            </label>

            <textarea
               class="form-control front-content"
               rows="4"
            ></textarea>

         </div>

         <div class="form-group">

            <label>
               <strong>Upload Image/GIF</strong>
            </label>

            <input
               type="file"
               class="form-control-file front-file"
               accept="image/*,.gif"
            >

            <div class="media-preview"></div>

         </div>

      </div>

      <!-- BACK -->

      <div
         class="tab-content"
         id="back-${cardCount}"
      >

         <div class="form-group">

            <label>
               <strong>Title</strong>
            </label>

            <input
               type="text"
               class="form-control back-title"
            >

         </div>

         <div class="form-group">

            <label>
               <strong>Content</strong>
            </label>

            <textarea
               class="form-control back-content"
               rows="4"
            ></textarea>

         </div>

         <div class="form-group">

            <label>
               <strong>Upload Image/GIF</strong>
            </label>

            <input
               type="file"
               class="form-control-file back-file"
               accept="image/*,.gif"
            >

            <div class="media-preview"></div>

         </div>

      </div>

   `;

   document
      .getElementById("cardContainer")
      .appendChild(wrapper);

   setupTabs(wrapper);
   setupDelete(wrapper);
   setupFilePreview(wrapper);

}

/* TABS */

function setupTabs(wrapper) {

   wrapper
      .querySelectorAll(".tab-btn")
      .forEach(btn => {

      btn.addEventListener("click", function() {

         wrapper
            .querySelectorAll(".tab-btn")
            .forEach(b => b.classList.remove("active"));

         wrapper
            .querySelectorAll(".tab-content")
            .forEach(c => c.classList.remove("active"));

         this.classList.add("active");

         document
            .getElementById(this.dataset.tab)
            .classList.add("active");

      });

   });

}

/* DELETE */

function setupDelete(wrapper) {

   wrapper
      .querySelector(".delete-btn")
      .addEventListener("click", function() {

      wrapper.remove();

   });

}

/* BASE64 IMAGE/GIF */

function setupFilePreview(wrapper) {

   wrapper
      .querySelectorAll("input[type='file']")
      .forEach(input => {

      input.addEventListener("change", function() {

         const file = this.files[0];

         if(!file) return;

         const reader = new FileReader();

         reader.onload = (e) => {

            const base64 = e.target.result;

            input.dataset.base64 = base64;

            this.parentElement
               .querySelector(".media-preview")
               .innerHTML = `
                  <img src="${base64}">
               `;

         };

         reader.readAsDataURL(file);

      });

   });

}

/* MEDIA HTML */

function getMediaHTML(fileInput) {

   const base64 = fileInput.dataset.base64;

   if(!base64) return "";

   return `
      <img
         src="${base64}"
         class="flip-media"
      >
   `;

}

/* BUILD CARD HTML */

function buildCardsHTML() {

   let cardsHTML = "";

   document
      .querySelectorAll(".card-builder")
      .forEach(builder => {

      const frontTitle =
         builder.querySelector(".front-title").value;

      const frontContent =
         builder.querySelector(".front-content").value;

      const backTitle =
         builder.querySelector(".back-title").value;

      const backContent =
         builder.querySelector(".back-content").value;

      const frontMedia =
         getMediaHTML(
            builder.querySelector(".front-file")
         );

      const backMedia =
         getMediaHTML(
            builder.querySelector(".back-file")
         );

      cardsHTML += `

<div
   class="flip-card"
   onclick="this.classList.toggle('flipped')"
>

   <div class="flip-inner">

      <!-- FRONT -->

      <div class="flip-front">

         ${frontMedia}

         <div class="flip-body">

            <div class="flip-title">
               ${frontTitle}
            </div>

            <div class="flip-text">
               ${frontContent}
            </div>

         </div>

      </div>

      <!-- BACK -->

      <div class="flip-back">

         ${backMedia}

         <div class="flip-body">

            <div class="flip-title">
               ${backTitle}
            </div>

            <div class="flip-text">
               ${backContent}
            </div>

         </div>

      </div>

   </div>

</div>

      `;

   });

   return cardsHTML;

}

/* PREVIEW */

function generatePreview() {

   document
      .getElementById("previewGrid")
      .innerHTML = buildCardsHTML();

}

/* FINAL COMPLETE HTML */

function generateFinalHTML() {

   const cardsHTML = buildCardsHTML();

   return `<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Flip Cards</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f7f7f7;
padding:40px;
}

.preview-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px;
}

@media(max-width:768px){
.preview-grid{
grid-template-columns:1fr;
}
}

.flip-card{
perspective:1200px;
height:500px;
cursor:pointer;
}

.flip-inner{
position:relative;
width:100%;
height:100%;
transition:transform .8s;
transform-style:preserve-3d;
}

.flip-card.flipped .flip-inner{
transform:rotateY(180deg);
}

.flip-front,
.flip-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:12px;
overflow:hidden;
background:white;
border:2px solid #ddd;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.flip-back{
transform:rotateY(180deg);
}

.flip-media{
width:100%;
height:220px;
object-fit:cover;
}

.flip-body{
padding:24px;
}

.flip-title{
font-size:1.4rem;
font-weight:700;
margin-bottom:15px;
}

.flip-text{
line-height:1.7;
color:#555;
}

</style>

</head>

<body>

<h1 style="text-align:center;margin-bottom:40px;">

${document.getElementById("mainFlipTitle").value}

</h1>

<div class="preview-grid">

${cardsHTML}

</div>

</body>

</html>`;

}

/* BUTTONS */

document
   .getElementById("addRowBtn")
   .addEventListener("click", createCardBuilder);

document
   .getElementById("previewBtn")
   .addEventListener("click", function() {

   generatePreview();

   document
      .getElementById("previewSection")
      .style.display = "block";

});

document
   .getElementById("backBtn")
   .addEventListener("click", function() {

   document
      .getElementById("previewSection")
      .style.display = "none";

});

document
   .getElementById("submitBtn")
   .addEventListener("click", function() {

   const finalHTML =
      generateFinalHTML();

   document
      .getElementById("generatedCode")
      .value = finalHTML;

   document
      .getElementById("generatedSection")
      .style.display = "block";

   window.scrollTo({

      top:
      document.getElementById("generatedSection").offsetTop,

      behavior:"smooth"

   });

});

document
   .getElementById("copyCodeBtn")
   .addEventListener("click", function() {

   const textarea =
      document.getElementById("generatedCode");

   textarea.select();

   document.execCommand("copy");

   this.innerHTML = `
      <i class="fas fa-check"></i>
      Copied!
   `;

});

/* INIT */

createCardBuilder();

</script></p></body></html>
